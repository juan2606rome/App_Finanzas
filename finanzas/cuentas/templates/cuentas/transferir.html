<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transferir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'cuentas:index' %}">Mis Finanzas</a>
            <div>
                <a href="{% url 'cuentas:index' %}" class="btn btn-outline-light btn-sm me-1">Inicio</a>
                <a href="{% url 'cuentas:transferir' %}" class="btn btn-outline-light btn-sm me-1">Transferir</a>
                <a href="{% url 'cuentas:historial_general' %}" class="btn btn-outline-light btn-sm me-1">Historial</a>
                <a href="{% url 'tasas:cotizacion' %}" class="btn btn-outline-warning btn-sm">Cotización USD</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <h4>Transferir entre mis cuentas</h4>
        <form method="post" class="col-md-6">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Desde</label>
                <select name="origen" class="form-select" required>
                    {% for c in cuentas %}
                    <option value="{{ c.id }}">{{ c.nombre }} (${{ c.saldo_formateado }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Hacia</label>
                <select name="destino" class="form-select" required>
                    {% for c in cuentas %}
                    <option value="{{ c.id }}">{{ c.nombre }} (${{ c.saldo_formateado }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Monto</label>
                <input type="number" step="1" name="monto" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción (opcional)</label>
                <input type="text" name="descripcion" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Transferir</button>
        </form>
    </div>
</body>
</html>
